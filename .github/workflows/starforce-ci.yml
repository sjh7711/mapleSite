name: Starforce CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Starforce tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: maplestarforce/.nvmrc
          package-manager-cache: false
      - run: npm --prefix maple-core ci
      - run: npm --prefix maplestarforce ci
      - run: npm --prefix maple-core test
      - run: npm --prefix maplestarforce test
      - run: npm --prefix maplestarforce run build:production
