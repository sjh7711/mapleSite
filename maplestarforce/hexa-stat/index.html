<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9238104084479585"
      crossorigin="anonymous"></script>
    <link rel="canonical" href="https://starforce.pages.dev/hexa-stat/" />
    <title>헥사 스탯 계산기 | 스타포스 데브</title>
    <meta name="application-name" content="스타포스 데브" />
    <meta property="og:site_name" content="스타포스 데브" />
    <meta name="description" content="헥사 스탯의 현재 코어와 목표 메인 레벨을 입력해 목표 도달 확률, 필요한 솔 에르다 조각, 등급별 초기화 기준을 계산합니다." />
    <link rel="stylesheet" href="../src/style.css" />
    <link rel="stylesheet" href="../src/calculator.css" />
    <link rel="stylesheet" href="../src/hexa-stat.css" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 96x96 256x256" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/tool-icons/starforce-star.svg" />
  </head>
  <body class="page--calculator page--hexa-stat">
    <main data-calculator="hexa-stat" class="page" google-side-rail-overlap="false">
      <header class="page__head">
        <h1>스타포스 데브</h1>
      </header>
      <nav id="toolnav" class="toolnav" aria-label="계산기 목록" google-side-rail-overlap="false"></nav>
      <div class="calculator-shell">
        <div id="tool" class="layout__main">
          <div class="calculator-grid hexa-layout">
            <form id="hexa-settings" class="card hexa-settings">
              <h2>헥사 스탯</h2>
              <fieldset>
                <legend>현재 코어</legend>
                <div class="hexa-levels">
                  <label class="field"><span>메인</span><select name="main" aria-label="현재 메인 레벨"></select></label>
                  <label class="field"><span>부가 1</span><select name="sub1" aria-label="현재 부가 1 레벨"></select></label>
                  <label class="field"><span>부가 2</span><select name="sub2" aria-label="현재 부가 2 레벨"></select></label>
                </div>
                <p class="section-note" data-hexa-output="grade"></p>
              </fieldset>
              <fieldset>
                <legend id="hexa-target-title">목표 메인 레벨</legend>
                <select name="target" aria-labelledby="hexa-target-title"></select>
                <label class="hexa-event"><input type="checkbox" name="event" />헥사 스탯 썬데이 메이플</label>
              </fieldset>
              <p class="section-note hexa-error" role="alert" hidden></p>
            </form>
            <section class="card result-card calculator-result" aria-labelledby="hexa-results-title">
              <h2 id="hexa-results-title">기댓값</h2>
              <dl class="hexa-summary" aria-live="polite">
                <div>
                  <dt>20레벨까지 평균 필요 솔 에르다 조각</dt>
                  <dd data-hexa-output="fragments"></dd>
                </div>
                <div>
                  <dt>목표 달성까지 평균 필요 솔 에르다 조각</dt>
                  <dd data-hexa-output="optimal"></dd>
                </div>
                <div class="hexa-summary__chance">
                  <dt>현재 코어에서 목표 도달 확률</dt>
                  <dd data-hexa-output="chance"></dd>
                </div>
              </dl>
              <div id="hexa-reach"></div>
              <section aria-labelledby="hexa-policy-title">
                <h3 id="hexa-policy-title">등급별 초기화 기준</h3>
                <table class="hexa-policy">
                  <thead><tr><th scope="col">코어 등급</th><th scope="col">초기화할 메인 레벨</th></tr></thead>
                  <tbody></tbody>
                </table>
              </section>
            </section>
          </div>
        </div>
      </div>
      <!-- site-footer -->
    </main>
    <script type="module" src="../src/shared/calculator-entry.js"></script>
  </body>
</html>
